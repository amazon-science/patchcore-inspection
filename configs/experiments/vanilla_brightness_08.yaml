experiment:
  name: patchcore_vanilla_brightness_08
  seed: 42
device:
  requested: auto
dataset:
  name: mvtec
  root: ../datasets/mvtec
  class_name: bottle
  resize: 256
  image_size: 224
patchcore:
  backbone: wideresnet50
  feature_layers: [layer2, layer3]
  coreset_ratio: 0.1
  pretrain_embedding_dimension: 1024
  target_embedding_dimension: 1024
  nearest_neighbors: 1
  patch_size: 3
evaluation:
  image_auroc: true
  pixel_auroc: true
  au_pro: true
augmentation:
  enabled: false
  brightness: [1.0, 1.0]
  contrast: [1.0, 1.0]
  gamma: [1.0, 1.0]
test_shift:
  enabled: true
  kind: brightness
  factor: 0.8
